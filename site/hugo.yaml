baseURL: "https://inkcheck.github.io/inkstudio/"
title: InkStudio
locale: en-gb

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false

enableInlineShortcodes: true
enableGitInfo: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Download
      url: "https://github.com/inkcheck/inkstudio/releases/latest"
      weight: 2
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/inkcheck/inkstudio"
      params:
        icon: github
  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: inkpress
      name: "inkpress: the slide format ↗"
      url: "https://inkcheck.github.io/inkpress/"
      weight: 2
    - identifier: inkline
      name: "inkline: diagrams ↗"
      url: "https://inkcheck.github.io/inkline/"
      weight: 3

params:
  description: A Mac app to write, present and export Markdown slides.
  page:
    width: normal
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: false
  highlight:
    copy:
      enable: true
      display: hover
